# Local checkpoints. Keep them fast; CI (scripts/ci.sh) owns the full matrix.
# Installed by `pnpm install` through the "prepare" script. Do not bypass with --no-verify.

pre-commit:
  parallel: false
  commands:
    biome:
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css,yml,yaml}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    docs-gates:
      glob: "{AGENTS.md,CLAUDE.md,**/AGENTS.md,.agents/**,docs/adr/**}"
      run: pnpm verify:docs
    whitespace:
      run: git diff --cached --check

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    # Only the packages changed against origin/main; the very first push (no origin/main yet)
    # runs the whole workspace instead of skipping.
    affected-typecheck-and-test:
      run: >
        if git rev-parse --verify --quiet origin/main >/dev/null;
        then pnpm turbo run typecheck test --filter="...[origin/main]";
        else pnpm turbo run typecheck test;
        fi
