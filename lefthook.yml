# Local checkpoints. Keep them fast; CI (scripts/ci.sh) owns the full matrix.
# Installed by `pnpm install` through the "prepare" script. Do not bypass with --no-verify.

pre-commit:
  parallel: false
  commands:
    biome:
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    docs-gates:
      glob: "{AGENTS.md,CLAUDE.md,**/AGENTS.md,.agents/**,docs/adr/**}"
      run: pnpm verify:docs
    whitespace:
      run: git diff --cached --check

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    affected-typecheck-and-test:
      run: pnpm turbo run typecheck test --filter="...[origin/main]"
