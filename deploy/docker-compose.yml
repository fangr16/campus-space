# Local development stack. `pnpm db:up` starts only the database; `docker compose up --build`
# runs the whole platform behind nginx on http://localhost:8080 (same topology as the ECS hosts,
# see deploy/docker-compose.deploy.yml).
name: campus-space

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus}
      POSTGRES_DB: ${POSTGRES_DB:-campus}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus} -d ${POSTGRES_DB:-campus}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
