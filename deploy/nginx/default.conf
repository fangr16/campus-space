# Single entry point for the whole platform. Service names resolve on the compose network.
# Each service keeps its own prefix (api/<service>) so nothing is rewritten here.

upstream platform { server platform:3000; }
upstream m1       { server m1-seat:3000; }
upstream m2       { server m2-room:3000; }
upstream m3       { server m3-repair:3000; }

# Brute-force protection for login: 10 requests per minute per client IP, small burst.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Ant Design injects inline styles; scripts stay external (Vite build).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

  location = /api/platform/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://platform;
    include /etc/nginx/proxy_params_campus;
  }
  location /api/platform/ { proxy_pass http://platform; include /etc/nginx/proxy_params_campus; }
  location /api/m1/       { proxy_pass http://m1;       include /etc/nginx/proxy_params_campus; }
  location /api/m2/       { proxy_pass http://m2;       include /etc/nginx/proxy_params_campus; }
  location /api/m3/       { proxy_pass http://m3;       include /etc/nginx/proxy_params_campus; }

  # Vite build output: hashed assets cache forever, index.html never.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
